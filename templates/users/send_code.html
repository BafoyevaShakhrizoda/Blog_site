{% extends 'users/base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-12">
    <div class="bg-white rounded-lg shadow-lg p-8">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-2">Sign Up</h2>
        <p class="text-center text-gray-600 mb-8">Enter your email to get started</p>

        <div id="alertContainer"></div>

        <form id="sendCodeForm">
            <div class="mb-6">
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="input-field" 
                    placeholder="your@email.com"
                    required
                >
            </div>

            <button 
                type="submit" 
                id="submitBtn"
                class="w-full btn-primary py-3 text-lg font-semibold"
            >
                Send Verification Code
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-gray-600">
                Already have an account? 
                <a href="{% url 'users:login_html' %}" class="text-blue-600 hover:text-blue-700 font-medium">Login</a>
            </p>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('sendCodeForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertContainer = document.getElementById('alertContainer');

    function showAlert(message, type = 'error') {
        const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
        alertContainer.innerHTML = `
            <div class="alert ${alertClass}">
                ${message}
            </div>
        `;
        setTimeout(() => {
            alertContainer.innerHTML = '';
        }, 5000);
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        
        if (!email) {
            showAlert('Please enter your email address');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending...';

        try {
            const response = await fetch('/users/api/send-code/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                showAlert(data.message, 'success');
                setTimeout(() => {
                    window.location.href = `/users/verify-code/?email=${encodeURIComponent(email)}`;
                }, 1500);
            } else {
                showAlert(data.message || 'An error occurred');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Verification Code';
            }
        } catch (error) {
            console.error('Error:', error);
            showAlert('Network error. Please try again.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Send Verification Code';
        }
    });
</script>
{% endblock %}
