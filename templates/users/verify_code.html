{% extends 'users/base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-12">
    <div class="bg-white rounded-lg shadow-lg p-8">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-2">Verify Your Email</h2>
        <p class="text-center text-gray-600 mb-8">Enter the 4-digit code sent to your email</p>

        <div id="alertContainer"></div>

        <form id="verifyCodeForm">
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="input-field bg-gray-50" 
                    value="{{ email }}"
                    readonly
                    required
                >
            </div>

            <div class="mb-6">
                <label for="code" class="block text-sm font-medium text-gray-700 mb-2">Verification Code</label>
                <input 
                    type="text" 
                    id="code" 
                    name="code" 
                    class="input-field text-center text-2xl tracking-widest" 
                    placeholder="0000"
                    maxlength="4"
                    pattern="[0-9]{4}"
                    required
                >
            </div>

            <button 
                type="submit" 
                id="submitBtn"
                class="w-full btn-primary py-3 text-lg font-semibold"
            >
                Verify Code
            </button>
        </form>

        <div class="mt-6 text-center">
            <button 
                id="resendBtn"
                class="text-blue-600 hover:text-blue-700 font-medium"
            >
                Resend Code
            </button>
            <p class="text-sm text-gray-500 mt-2" id="resendTimer"></p>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('verifyCodeForm');
    const submitBtn = document.getElementById('submitBtn');
    const resendBtn = document.getElementById('resendBtn');
    const resendTimer = document.getElementById('resendTimer');
    const alertContainer = document.getElementById('alertContainer');
    const emailInput = document.getElementById('email');
    const codeInput = document.getElementById('code');

    let canResend = false;
    let countdown = 120;

    function showAlert(message, type = 'error') {
        const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
        alertContainer.innerHTML = `
            <div class="alert ${alertClass}">
                ${message}
            </div>
        `;
        setTimeout(() => {
            alertContainer.innerHTML = '';
        }, 5000);
    }

    function startResendTimer() {
        canResend = false;
        resendBtn.disabled = true;
        resendBtn.classList.add('opacity-50', 'cursor-not-allowed');
        
        const interval = setInterval(() => {
            countdown--;
            resendTimer.textContent = `Resend available in ${countdown}s`;
            
            if (countdown <= 0) {
                clearInterval(interval);
                canResend = true;
                resendBtn.disabled = false;
                resendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                resendTimer.textContent = '';
            }
        }, 1000);
    }

    // Only allow numbers in code input
    codeInput.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/[^0-9]/g, '');
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = emailInput.value.trim();
        const code = codeInput.value.trim();
        
        if (!email || !code || code.length !== 4) {
            showAlert('Please enter a valid 4-digit code');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Verifying...';

        try {
            const response = await fetch('/users/api/verify-code/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email, code })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                showAlert(data.message, 'success');
                setTimeout(() => {
                    window.location.href = `/users/complete-signup/?email=${encodeURIComponent(email)}`;
                }, 1500);
            } else {
                showAlert(data.message || 'Invalid or expired code');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Verify Code';
            }
        } catch (error) {
            console.error('Error:', error);
            showAlert('Network error. Please try again.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Verify Code';
        }
    });

    resendBtn.addEventListener('click', async () => {
        if (!canResend) return;
        
        const email = emailInput.value.trim();
        
        resendBtn.disabled = true;
        const originalText = resendBtn.textContent;
        resendBtn.textContent = 'Sending...';

        try {
            const response = await fetch('/users/api/resend-code/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                showAlert(data.message, 'success');
                countdown = 120;
                startResendTimer();
            } else {
                showAlert(data.message || 'Failed to resend code');
                resendBtn.disabled = false;
                resendBtn.textContent = originalText;
            }
        } catch (error) {
            console.error('Error:', error);
            showAlert('Network error. Please try again.');
            resendBtn.disabled = false;
            resendBtn.textContent = originalText;
        }
    });

    // Start timer on page load
    startResendTimer();
</script>
{% endblock %}
