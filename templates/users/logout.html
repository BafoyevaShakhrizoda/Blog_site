{% extends 'users/base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-20">
    <div class="bg-white rounded-lg shadow-lg p-8 text-center">
        <div class="mb-6">
            <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto">
                <svg class="w-10 h-10 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
            </div>
        </div>

        <h2 class="text-2xl font-bold text-gray-800 mb-4">Logout</h2>
        <p class="text-gray-600 mb-8">Are you sure you want to logout?</p>

        <div id="alertContainer" class="mb-4"></div>

        <div class="flex gap-4 justify-center">
            <button 
                id="logoutBtn"
                class="px-6 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors duration-200"
            >
                Yes, Logout
            </button>
            <a 
                href="{% url 'users:profile_html' %}" 
                class="px-6 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 transition-colors duration-200"
            >
                Cancel
            </a>
        </div>
    </div>
</div>

<script>
    const logoutBtn = document.getElementById('logoutBtn');
    const alertContainer = document.getElementById('alertContainer');

    function showAlert(message, type = 'error') {
        const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
        alertContainer.innerHTML = `
            <div class="alert ${alertClass}">
                ${message}
            </div>
        `;
    }

    logoutBtn.addEventListener('click', async () => {
        logoutBtn.disabled = true;
        logoutBtn.textContent = 'Logging out...';

        try {
            const refreshToken = localStorage.getItem('refresh_token');
            
            const response = await fetch('/users/api/logout/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ 
                    refresh: refreshToken || '' 
                })
            });

            const data = await response.json();

            // Clear tokens from localStorage
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');

            if (response.ok && data.success) {
                showAlert(data.message, 'success');
                setTimeout(() => {
                    window.location.href = '/users/login/';
                }, 1000);
            } else {
                // Even if API fails, redirect to login since we cleared tokens
                showAlert('Logged out successfully', 'success');
                setTimeout(() => {
                    window.location.href = '/users/login/';
                }, 1000);
            }
        } catch (error) {
            console.error('Error:', error);
            // Clear tokens and redirect anyway
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            showAlert('Logged out successfully', 'success');
            setTimeout(() => {
                window.location.href = '/users/login/';
            }, 1000);
        }
    });
</script>
{% endblock %}
