{% extends 'users/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto mt-12">
    <div class="bg-white rounded-lg shadow-lg p-8">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-2">Complete Your Profile</h2>
        <p class="text-center text-gray-600 mb-8">Just a few more details to get started</p>

        <div id="alertContainer"></div>

        <form id="completeSignupForm">
            <input type="hidden" id="email" name="email" value="{{ email }}">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label for="first_name" class="block text-sm font-medium text-gray-700 mb-2">First Name *</label>
                    <input 
                        type="text" 
                        id="first_name" 
                        name="first_name" 
                        class="input-field" 
                        placeholder="John"
                        required
                    >
                </div>

                <div>
                    <label for="last_name" class="block text-sm font-medium text-gray-700 mb-2">Last Name *</label>
                    <input 
                        type="text" 
                        id="last_name" 
                        name="last_name" 
                        class="input-field" 
                        placeholder="Doe"
                        required
                    >
                </div>
            </div>

            <div class="mb-6">
                <label for="phone_number" class="block text-sm font-medium text-gray-700 mb-2">Phone Number (Optional)</label>
                <input 
                    type="tel" 
                    id="phone_number" 
                    name="phone_number" 
                    class="input-field" 
                    placeholder="+998 90 123 45 67"
                >
            </div>

            <div class="mb-6">
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password *</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="input-field" 
                    placeholder="Min. 8 characters"
                    minlength="8"
                    required
                >
                <p class="text-xs text-gray-500 mt-1">Password must be at least 8 characters long</p>
            </div>

            <div class="mb-6">
                <label for="password_confirm" class="block text-sm font-medium text-gray-700 mb-2">Confirm Password *</label>
                <input 
                    type="password" 
                    id="password_confirm" 
                    name="password_confirm" 
                    class="input-field" 
                    placeholder="Re-enter your password"
                    minlength="8"
                    required
                >
            </div>

            <button 
                type="submit" 
                id="submitBtn"
                class="w-full btn-primary py-3 text-lg font-semibold"
            >
                Complete Sign Up
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-gray-600">
                Already have an account? 
                <a href="{% url 'users:login_html' %}" class="text-blue-600 hover:text-blue-700 font-medium">Login</a>
            </p>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('completeSignupForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertContainer = document.getElementById('alertContainer');

    function showAlert(message, type = 'error') {
        const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
        alertContainer.innerHTML = `
            <div class="alert ${alertClass}">
                ${message}
            </div>
        `;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setTimeout(() => {
            alertContainer.innerHTML = '';
        }, 5000);
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const formData = {
            email: document.getElementById('email').value.trim(),
            first_name: document.getElementById('first_name').value.trim(),
            last_name: document.getElementById('last_name').value.trim(),
            phone_number: document.getElementById('phone_number').value.trim(),
            password: document.getElementById('password').value,
            password_confirm: document.getElementById('password_confirm').value
        };

        // Validation
        if (!formData.first_name || !formData.last_name) {
            showAlert('Please enter your first and last name');
            return;
        }

        if (formData.first_name.length < 2) {
            showAlert('First name must be at least 2 characters long');
            return;
        }

        if (formData.last_name.length < 2) {
            showAlert('Last name must be at least 2 characters long');
            return;
        }

        if (formData.password.length < 8) {
            showAlert('Password must be at least 8 characters long');
            return;
        }

        if (formData.password !== formData.password_confirm) {
            showAlert('Passwords do not match');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating Account...';

        try {
            const response = await fetch('/users/api/complete-signup/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            });

            const data = await response.json();

            if (response.ok && data.success) {
                showAlert(data.message, 'success');
                
                // Store tokens if provided
                if (data.data && data.data.tokens) {
                    localStorage.setItem('access_token', data.data.tokens.access);
                    localStorage.setItem('refresh_token', data.data.tokens.refresh);
                }
                
                setTimeout(() => {
                    window.location.href = '/users/profile/';
                }, 1500);
            } else {
                showAlert(data.message || 'An error occurred during signup');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Complete Sign Up';
            }
        } catch (error) {
            console.error('Error:', error);
            showAlert('Network error. Please try again.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Complete Sign Up';
        }
    });
</script>
{% endblock %}
